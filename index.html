<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตารางไลฟ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface-2:#faf9f6; --ink:#1d1b18; --ink-2:#55514a; --ink-3:#8a857c;
  --line:#e6e2da; --line-2:#d6d1c6;
  --accent:#06c755; --accent-ink:#ffffff; --accent-soft:#e3f8eb;
  --open:#0a8f4a; --open-bg:#e6f6ec; --open-line:#9fdcb7;
  --full:#6b7280; --full-bg:#eef0f2;
  --closed:#a8a29e; --closed-bg:transparent;
  --pending:#b45309; --pending-bg:#fff4e0; --pending-line:#f5c97a;
  --danger:#d9342b; --danger-bg:#fdecea;
  --shadow:0 1px 2px rgba(30,25,15,.06),0 4px 16px rgba(30,25,15,.06);
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141412; --surface:#1d1c1a; --surface-2:#232220; --ink:#f1efe9; --ink-2:#b9b4aa; --ink-3:#8a857c;
  --line:#2f2d29; --line-2:#3c3a35; --accent-soft:#11331f;
  --open:#4fd18a; --open-bg:#143222; --open-line:#2d6b47; --full:#9aa1ab; --full-bg:#26282b;
  --pending:#f3b45a; --pending-bg:#3a2a12; --pending-line:#7a5520; --danger:#ff6b61; --danger-bg:#3a1916;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#141412; --surface:#1d1c1a; --surface-2:#232220; --ink:#f1efe9; --ink-2:#b9b4aa; --ink-3:#8a857c;
  --line:#2f2d29; --line-2:#3c3a35; --accent-soft:#11331f;
  --open:#4fd18a; --open-bg:#143222; --open-line:#2d6b47; --full:#9aa1ab; --full-bg:#26282b;
  --pending:#f3b45a; --pending-bg:#3a2a12; --pending-line:#7a5520; --danger:#ff6b61; --danger-bg:#3a1916;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink-3);padding:3px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.live.on i{background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2s infinite}
.live.on{color:var(--open)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.spacer{flex:1}
.me{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px;border-radius:99px}
.me img,.me .av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--line)}
.me .nm{font-weight:600;font-size:14px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .rl{font-size:11px;color:var(--ink-3);display:block;line-height:1}

.demo-bar{background:#1d1b18;color:#f5f4f0;font-size:13px}
.demo-bar .wrap{display:flex;gap:12px;align-items:center;min-height:38px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.demo-bar label{display:flex;gap:6px;align-items:center}

/* month + tabs */
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 0 10px}
.month{display:flex;align-items:center;gap:4px}
.month h1{font-size:22px;margin:0 6px;letter-spacing:-.02em;font-weight:700;min-width:150px;text-align:center}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px}
.icon-btn:hover{border-color:var(--line-2)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:500;color:var(--ink-2);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab.on{background:var(--ink);color:var(--bg)}
.badge{min-width:18px;height:18px;border-radius:99px;background:var(--pending);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:12.5px;color:var(--ink-3);font-weight:500}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.stat .s{font-size:12px;color:var(--ink-3)}
.stat.open .v{color:var(--open)} .stat.pend .v{color:var(--pending)}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent);width:16px;height:16px;margin:0}

/* legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin:0 0 12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend b{width:12px;height:12px;border-radius:4px;display:inline-block}

/* date strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:thin}
.dchip{flex:0 0 auto;width:54px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0 7px;text-align:center;scroll-snap-align:center;position:relative}
.dchip .wd{font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.dchip .wd i{width:6px;height:6px;border-radius:50%}
.dchip .dn{font-size:19px;font-weight:700;line-height:1.25}
.dchip .oc{font-size:10.5px;color:var(--open);font-weight:600;height:15px}
.dchip.past{opacity:.45}
.dchip.today{border-color:var(--ink)}
.dchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dchip.on .oc{color:var(--accent)}

/* day cards */
.day-title{display:flex;align-items:baseline;gap:10px;margin:6px 0 10px}
.day-title h2{margin:0;font-size:18px}
.day-title .sub{color:var(--ink-3);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.card-h{padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.card-h .sw{width:10px;height:28px;border-radius:4px}
.card-h .t{font-weight:700}
.card-h .st{font-size:12px;color:var(--ink-3)}
.srow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .tm{font-weight:600;font-size:14px;width:96px;flex:0 0 auto}
.srow .sl{flex:1;display:flex;justify-content:flex-end}

/* pills */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:96px;max-width:100%;height:30px;padding:0 12px;border-radius:99px;font-size:13.5px;font-weight:600;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;transition:transform .08s}
button.pill:active{transform:scale(.97)}
.p-open{background:var(--open-bg);color:var(--open);border-color:var(--open-line)}
button.p-open:hover{background:var(--open);color:#fff}
.p-full{background:var(--full-bg);color:var(--full)}
.p-closed{color:var(--closed);border:1px dashed var(--line-2);font-weight:500}
.p-pend{background:var(--pending-bg);color:var(--pending);border:1px dashed var(--pending-line)}
.p-name{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.p-mine{outline:2px solid var(--ink);outline-offset:1px}
.pill.past{opacity:.55}
.pill small{font-weight:500;font-size:11px;opacity:.85}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent)}20%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}

/* grid view */
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:calc(100vh - 150px);box-shadow:var(--shadow)}
table.g{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.g th,table.g td{padding:4px 5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
table.g thead th{position:sticky;background:var(--surface);z-index:2}
table.g thead tr.r1 th{top:0;height:34px;font-size:13.5px}
table.g thead tr.r2 th{top:34px;font-weight:600;font-size:12px;color:var(--ink-2);background:var(--surface-2)}
table.g th.ch{color:#1d1b18;border-left:3px solid var(--surface)}
table.g td.first,table.g th.first{position:sticky;left:0;background:var(--surface);z-index:3;text-align:left;padding-left:10px;border-right:1px solid var(--line)}
table.g thead th.first{z-index:4}
table.g td.cl{border-left:3px solid var(--surface)}
table.g tr.past td{opacity:.5}
table.g tr.today td.first{box-shadow:inset 3px 0 0 var(--ink)}
table.g .pill{min-width:84px;height:26px;font-size:12.5px;padding:0 9px}
.dlab{display:flex;align-items:center;gap:8px;font-weight:600}
.dlab .wdp{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:99px;min-width:46px;text-align:center}

/* lists */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel + .panel{margin-top:14px}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h3{margin:0;font-size:16px}
.panel-h .sub{color:var(--ink-3);font-size:13px}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .when{width:62px;flex:0 0 auto;text-align:center}
.li .when .d{font-size:20px;font-weight:700;line-height:1.1}
.li .when .w{font-size:11.5px;font-weight:600}
.li .what{flex:1;min-width:0}
.li .what .a{font-weight:600}
.li .what .b{font-size:13px;color:var(--ink-3)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:7px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.go{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.warn{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:var(--danger-bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:12px 18px;font-size:16px;border-radius:12px;width:100%}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* summary bars */
.bars{padding:8px 16px 14px}
.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;padding:5px 0}
.bar .n{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:20px;background:var(--surface-2);border-radius:6px;overflow:hidden;display:flex}
.bar .fill{height:100%;border-radius:6px 0 0 6px}
.bar .fill.p{background:repeating-linear-gradient(45deg,var(--pending-line) 0 4px,transparent 4px 8px);border-radius:0}
.bar .c{font-size:13.5px;text-align:right;font-weight:600}
.bar .c small{color:var(--pending);font-weight:500}

/* staff admin */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:14px 16px}
.scard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.scard .info{flex:1;min-width:0;font-size:12.5px;color:var(--ink-3)}
.scard img{width:28px;height:28px;border-radius:50%}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,12,8,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(0,0,0,.2);animation:up .2s ease-out;max-height:92vh;overflow:auto}
@media (min-width:640px){.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .lead{color:var(--ink-3);margin:0 0 14px;font-size:14px}
.ticket{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.ticket .tt{padding:10px 14px;font-weight:700;color:#1d1b18;display:flex;justify-content:space-between;gap:8px}
.ticket dl{margin:0;padding:6px 14px 10px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.ticket dt{color:var(--ink-3)}
.ticket dd{margin:0;font-weight:600;text-align:right}
.confirm-box{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:14px;cursor:pointer;font-size:14px}
.confirm-box input{width:20px;height:20px;accent-color:var(--accent);margin:1px 0 0;flex:0 0 auto}
.steps{display:flex;gap:6px;margin:0 0 14px;font-size:12px;color:var(--ink-3)}
.steps span{flex:1;border-top:3px solid var(--line);padding-top:5px}
.steps span.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.btns{display:flex;gap:8px}
.btns .btn{flex:1;padding:11px 14px;font-size:15px;border-radius:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13.5px;color:var(--ink-2)}
.field select,.field input[type=text]{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:15px}
.note{font-size:12.5px;color:var(--ink-3);margin-top:10px}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}

/* toast */
.toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);max-width:420px;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);animation:up .2s;pointer-events:auto}
.toast.err{background:var(--danger);color:#fff}
.toast.ok{background:var(--open);color:#fff}

/* login */
.center{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login{width:100%;max-width:380px;text-align:center}
.login .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-size:28px;font-weight:700}
.login h1{margin:0 0 6px;font-size:24px}
.login p{color:var(--ink-3);margin:0 0 22px}
.line-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;background:#06c755;color:#fff;font-weight:700;font-size:16px;padding:13px;border-radius:12px}
.line-btn:hover{background:#05b34c}
.line-btn svg{width:22px;height:22px}
.namegrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 18px}
.namegrid .pill{min-width:0;height:36px;font-size:15px;padding:0 16px;cursor:pointer}
.small-link{font-size:13px;color:var(--ink-3);margin-top:18px;display:inline-block}
.loader{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
main{padding-bottom:60px}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="loader"></div></div></div>
<div class="toasts" id="toasts"></div>

<script>
/* ===== Config ===== */
const SUPABASE_URL = "https://gexapkcuvultnrxiyvgd.supabase.co";

let sb = null;

function makeLiveApi() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  return {
    async config() { const { data } = await sb.rpc("get_public_config"); return data || {}; },
    async session() { const { data } = await sb.auth.getSession(); return data.session; },
    async loadBase() {
      const [c, sh, st] = await Promise.all([
        sb.from("channels").select("*").order("sort_order"),
        sb.from("shifts").select("*").order("sort_order"),
        sb.from("staff").select("*").order("nickname")]);
      for (const r of [c, sh, st]) if (r.error) throw r.error;
      return { channels: c.data, shifts: sh.data, staff: st.data };
    },
    async loadMonth(y, m) {
      const { data, error } = await sb.from("slots").select("*").gte("work_date", ymd(y, m, 1)).lte("work_date", ymd(y, m, daysIn(y, m)));
      if (error) throw error; return data;
    },
    async rpc(name, args) {
      const { data, error } = await sb.rpc(name, args);
      if (error) throw new Error(error.message); return data;
    },
    subscribe(onEvt, onStatus) {
      sb.channel("live").on("postgres_changes", { event: "*", schema: "public", table: "slots" }, p => onEvt("slots", p))
        .on("postgres_changes", { event: "*", schema: "public", table: "staff" }, p => onEvt("staff", p))
        .subscribe(st => onStatus(st === "SUBSCRIBED"));
    },
    async signOut() { await sb.auth.signOut(); }
  };
}

function makeDemoApi() {
  const D = JSON.parse(JSON.stringify(DEMO_DATA));
  const meId = D.staff.find(s => s.nickname === "พีม").id;
  D.staff.forEach(s => { if (s.id === meId) { s.auth_user_id = "demo"; s.line_display_name = "Peem (LINE)"; } });
  // a couple of pending requests to show the approval flow
  const mk = (code, date, label, nick) => {
    const ch = D.channels.find(c => c.code === code); const sh = D.shifts.find(s => s.channel_id === ch.id && s.label === label);
    const sl = D.slots.find(x => x.shift_id === sh.id && x.work_date === date); sl.status = "pending"; sl.staff_id = D.staff.find(s => s.nickname === nick).id; sl.requested_at = new Date().toISOString();
  };
  mk("warawut", "2026-10-26", "17.00-05.00", "จั๊กจั่น"); mk("support", "2026-10-20", "23.00-08.00", "พีม");
  let listener = null; const emit = (row, old) => listener && setTimeout(() => listener("slots", { eventType: "UPDATE", new: { ...row }, old }), 120);
  const meRow = () => D.staff.find(s => s.id === meId);
  const find = id => D.slots.find(s => s.id === id);
  const fns = {
    claim_staff() { return meRow(); },
    request_booking({ p_slot_id }) { const s = find(p_slot_id); if (s.status !== "open") throw new Error("ช่องนี้ไม่ว่างแล้ว มีคนจองก่อนหน้า"); Object.assign(s, { status: "pending", staff_id: meId, requested_at: new Date().toISOString() }); emit(s); return s; },
    cancel_booking({ p_slot_id }) { const s = find(p_slot_id); if (s.staff_id !== meId || s.status !== "pending") throw new Error("ยกเลิกได้เฉพาะรายการของตัวเองที่ยังรออนุมัติ"); Object.assign(s, { status: "open", staff_id: null }); emit(s); return s; },
    admin_review({ p_slot_id, p_approve }) { if (meRow().role !== "admin") throw new Error("เฉพาะแอดมิน"); const s = find(p_slot_id); if (p_approve) Object.assign(s, { status: "approved", approved_by: meId }); else Object.assign(s, { status: "open", staff_id: null }); emit(s); return s; },
    admin_set_slot({ p_slot_id, p_status, p_staff_id }) { if (meRow().role !== "admin") throw new Error("เฉพาะแอดมิน"); const s = find(p_slot_id); Object.assign(s, { status: p_status, staff_id: ["approved", "pending"].includes(p_status) ? p_staff_id : null }); emit(s); return s; },
    admin_generate_month({ p_year, p_month }) {
      let n = 0, id = Math.max(...D.slots.map(s => s.id)) + 1;
      for (let d = 1; d <= daysIn(p_year, p_month); d++) for (const sh of D.shifts) {
        const wd = ymd(p_year, p_month, d); if (!D.slots.some(s => s.work_date === wd && s.shift_id === sh.id)) { D.slots.push({ id: id++, work_date: wd, shift_id: sh.id, status: "open", staff_id: null }); n++; }
      } return n;
    },
    admin_upsert_staff(a) { let r = a.p_id ? D.staff.find(s => s.id === a.p_id) : null; if (!r) { r = { id: "n" + Date.now(), auth_user_id: null, active: true }; D.staff.push(r); } Object.assign(r, { nickname: a.p_nickname ?? r.nickname, bg_color: a.p_bg ?? r.bg_color, fg_color: a.p_fg ?? r.fg_color, role: a.p_role ?? r.role, active: a.p_active ?? r.active }); return r; },
    admin_unlink_staff({ p_id }) { const r = D.staff.find(s => s.id === p_id); r.auth_user_id = null; return r; }
  };
  return {
    demoSetAdmin(on) { meRow().role = on ? "admin" : "staff"; },
    async config() { return { liff_id: "demo" }; },
    async session() { return { user: { id: "demo", user_metadata: { name: "Peem (LINE)" } } }; },
    async loadBase() { return { channels: D.channels, shifts: D.shifts, staff: D.staff }; },
    async loadMonth(y, m) { const p = `${y}-${pad(m)}-`; return D.slots.filter(s => s.work_date.startsWith(p)).map(s => ({ ...s })); },
    async rpc(name, args) { await new Promise(r => setTimeout(r, 250)); return fns[name](args || {}); },
    subscribe(onEvt, onStatus) { listener = onEvt; setTimeout(() => onStatus(true), 400); },
    async signOut() { location.href = location.pathname; }
  };
}

/* ===== LINE login (LIFF) ===== */
let LIFF_ID = "";
function loadLiff() {
  return new Promise((res, rej) => {
    if (window.liff) return res();
    const s = document.createElement("script"); s.src = "https://static.line-scdn.net/liff/edge/2/sdk.js";
    s.onload = res; s.onerror = () => rej(new Error("โหลด LINE SDK ไม่สำเร็จ")); document.head.appendChild(s);
  });
}
async function lineExchange() {
  const idToken = liff.getIDToken();
  if (!idToken) throw new Error("ไม่ได้รับ ID token จาก LINE (ตรวจสอบว่าเปิด scope openid แล้ว)");
  const r = await fetch(`${SUPABASE_URL}/functions/v1/line-login`, {
    method: "POST", headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
    body: JSON.stringify({ id_token: idToken })
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { liff.logout(); liff.login({ redirectUri: location.href.split("#")[0] }); throw new Error("กำลังเข้าสู่ระบบใหม่…"); }
  if (!r.ok) throw new Error(j.error || "เข้าสู่ระบบไม่สำเร็จ");
  const { error } = await sb.auth.setSession({ access_token: j.access_token, refresh_token: j.refresh_token });
  if (error) throw error;
}

/* ===== App ===== */
async function startApp() {
  const t = parseD(todayStr());
  if (!S.y) { S.y = t.y; S.m = t.m; S.sel = todayStr(); }
  renderShell();
  await loadMonth();
  API.subscribe(onRealtime, on => { S.live = on; const l = $("#live"); if (l) { l.classList.toggle("on", on); l.lastChild.textContent = on ? "อัปเดตสด" : "กำลังเชื่อมต่อ…"; } });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") loadMonth(true); });
}

async function loadMonth(silent) {
  try {
    const rows = await API.loadMonth(S.y, S.m);
    S.slots = new Map(rows.map(r => [r.id, r]));
    render();
  } catch (e) { if (!silent) toast("โหลดข้อมูลไม่สำเร็จ: " + e.message, "err"); }
}

function onRealtime(table, p) {
  if (table === "staff") {
    const r = p.new && p.new.id ? p.new : null;
    if (r) { const i = S.staff.findIndex(s => s.id === r.id); if (i >= 0) S.staff[i] = r; else S.staff.push(r); if (S.me && r.id === S.me.id) S.me = r; }
    return render();
  }
  if (p.eventType === "DELETE") { S.slots.delete(p.old.id); return render(); }
  const r = p.new; const prev = S.slots.get(r.id);
  const inMonth = r.work_date.startsWith(`${S.y}-${pad(S.m)}-`);
  if (inMonth) { S.slots.set(r.id, r); S.flash.add(r.id); }
  if (prev && S.me && prev.staff_id === S.me.id && prev.status === "pending") {
    const label = slotLabel(r);
    if (r.status === "approved") toast(`✓ อนุมัติแล้ว: ${label}`, "ok");
    else if (r.status === "open") toast(`คำขอถูกปฏิเสธ/ยกเลิก: ${label}`, "err");
  }
  render();
  setTimeout(() => S.flash.delete(r.id), 1700);
}

function render() {
  const main = $("#main"); if (!main) return;
  const pendingCount = [...S.slots.values()].filter(s => s.status === "pending").length;
  const tabs = [["overview", "ภาพรวม"], ["mine", "กะของฉัน"], ["summary", "สรุปรายคน"]];
  if (isAdmin()) tabs.push(["admin", `แอดมิน${pendingCount ? ` <span class="badge">${pendingCount}</span>` : ""}`]);
  if (S.tab === "admin" && !isAdmin()) S.tab = "overview";
  main.innerHTML = `
    <div class="head">
      <div class="month"><button class="icon-btn" id="pm" aria-label="เดือนก่อน">‹</button><h1>${TH_MONTHS[S.m - 1]} ${S.y + 543}</h1><button class="icon-btn" id="nm" aria-label="เดือนถัดไป">›</button></div>

    </div>
    <section id="body"></section>`;
  $("#pm").onclick = () => shiftMonth(-1); $("#nm").onclick = () => shiftMonth(1);
  main.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });

  if (S.tab === "overview") renderOverview(body);

function shiftMonth(d) {
  let m = S.m + d, y = S.y; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
  S.y = y; S.m = m; const t = todayStr();
  S.sel = t.startsWith(`${y}-${pad(m)}`) ? t : ymd(y, m, 1);
  loadMonth();
}

function pill(s, compact) {
  if (!s) return `<span class="pill p-closed">—</span>`;
  const past = s.work_date < todayStr() ? " past" : "";
  const fl = S.flash.has(s.id) ? " flash" : "";
  if (s.status === "open") return past ? `<span class="pill p-closed${past}">ว่าง (ผ่านแล้ว)</span>` : `<button class="pill p-open${fl}" data-slot="${s.id}">${compact ? "ว่าง" : "ว่าง · จอง"}</button>`;
  const tag = (isAdmin() || s.staff_id === S.me.id) ? "button" : "span";
  const at = tag === "button" ? ` data-slot="${s.id}"` : "";
  if (s.status === "full") return isAdmin() ? `<button class="pill p-full${past}${fl}" data-slot="${s.id}">เต็มแล้ว</button>` : `<span class="pill p-full${past}">เต็มแล้ว</span>`;
  if (s.status === "closed") return isAdmin() ? `<button class="pill p-closed${past}${fl}" data-slot="${s.id}">ไม่รับคน</button>` : `<span class="pill p-closed${past}">ไม่รับคน</span>`;
  const st = staffById(s.staff_id) || { nickname: "?", bg_color: "#999", fg_color: "#fff" };
  const mine = s.staff_id === S.me.id ? " p-mine" : "";
  if (s.status === "pending") return `<${tag} class="pill p-pend${mine}${past}${fl}"${at} title="รออนุมัติ">${esc(st.nickname)} <small>รออนุมัติ</small></${tag}>`;
  return `<${tag} class="pill p-name${mine}${past}${fl}"${at} style="background:${st.bg_color};color:${st.fg_color}">${esc(st.nickname)}</${tag}>`;
}

function stats() {
  const t = todayStr(); let open = 0, pend = 0, mine = 0, minePend = 0, openToday = 0;
  for (const s of S.slots.values()) {
    if (s.status === "open" && s.work_date >= t) { open++; if (s.work_date === t) openToday++; }
    if (s.status === "pending") pend++;
    if (s.staff_id === S.me.id) { if (s.status === "approved") mine++; else if (s.status === "pending") minePend++; }
  }
  return { open, pend, mine, minePend, openToday };
}

async function review(id, approve) {

  catch (e) { toast(e.message, "err"); }
}

async function genMonth() {
  try { const n = await API.rpc("admin_generate_month", { p_year: S.y, p_month: S.m }); toast(`เพิ่ม ${n} ช่อง`, "ok"); loadMonth(); }

}

/* ===== Slot dialogs ===== */
function ticket(s) {
  const sh = shiftById(s.shift_id); const c = chanById(sh.channel_id); const p = parseD(s.work_date);
  return `<div class="ticket"><div class="tt" style="background:${c.color}"><span>${esc(c.name)}</span><span style="font-weight:500">${esc(c.subtitle || "")}</span></div>
    <dl><dt>วัน</dt><dd><span style="color:${WD_COLOR[p.wd]}">●</span> ${thDate(s.work_date)}</dd><dt>เวลา</dt><dd class="tnum">${sh.label} น.</dd><dt>สถานะ</dt><dd>${STATUS_TXT[s.status]}${s.staff_id ? " · " + esc(staffById(s.staff_id)?.nickname) : ""}</dd></dl></div>`;
}

function openSlot(id) {
  const s = S.slots.get(id); if (!s) return;
  const past = s.work_date < todayStr();
  if (s.status === "open" && !past && !isAdmin()) return bookFlow(s);
  if (s.status === "pending" && s.staff_id === S.me.id && !isAdmin()) return confirmCancel(id);
  if (isAdmin()) return adminSlot(s);
  openSheet(`<h3>รายละเอียดกะ</h3><p class="lead"></p>${ticket(s)}<div class="btns"><button class="btn" data-close>ปิด</button></div>`);
}

function bookFlow(s) {
  // Step 1: review + tick confirmation
  openSheet(`<div class="steps"><span class="on">1 ตรวจสอบ</span><span>2 ยืนยัน</span><span>3 แอดมินอนุมัติ</span></div>
    <h3>จองกะนี้?</h3><p class="lead">ตรวจสอบวันและเวลาให้แน่ใจก่อนส่งคำขอ</p>${ticket(s)}
    <label class="confirm-box"><input type="checkbox" id="sure"><span>ฉันตรวจสอบวัน-เวลาแล้ว และ<b>มั่นใจว่าจะเข้ากะนี้ได้</b></span></label>
    <div class="btns"><button class="btn" data-close>ยกเลิก</button><button class="btn go" id="next" disabled>ถัดไป</button></div>`);
  $("#sure").onchange = e => $("#next").disabled = !e.target.checked;
  $("#next").onclick = () => {
    // Step 2: final confirm
    const sh = shiftById(s.shift_id); const c = chanById(sh.channel_id);
    openSheet(`<div class="steps"><span class="on">1 ตรวจสอบ</span><span class="on">2 ยืนยัน</span><span>3 แอดมินอนุมัติ</span></div>
      <h3>ยืนยันครั้งสุดท้าย</h3>
      <p class="lead">คุณกำลังจอง <b>${esc(c.name)} ${sh.label}</b><br>${thDate(s.work_date)}</p>
      <p class="note" style="margin:0 0 16px">เมื่อส่งแล้ว ช่องนี้จะถูกล็อกเป็น "รออนุมัติ" ทันที คนอื่นจะจองซ้ำไม่ได้ ยกเลิกเองได้จนกว่าแอดมินจะอนุมัติ</p>
      <div class="btns"><button class="btn" id="back">ย้อนกลับ</button><button class="btn go" id="go">ยืนยันจอง</button></div>`);
    $("#back").onclick = () => bookFlow(s);
    $("#go").onclick = async () => {
      $("#go").disabled = true; $("#go").textContent = "กำลังส่ง…";
      try { const r = await API.rpc("request_booking", { p_slot_id: s.id }); if (r && r.id) { S.slots.set(r.id, r); } closeSheet(); render(); toast("ส่งคำขอแล้ว รอแอดมินอนุมัติ", "ok"); }
      catch (e) { closeSheet(); toast(e.message, "err"); loadMonth(true); }
    };
  };
}

function confirmCancel(id) {
  const s = S.slots.get(id);
  openSheet(`<h3>ยกเลิกคำขอนี้?</h3><p class="lead">ช่องจะกลับเป็น "ว่าง" ให้คนอื่นจองได้</p>${ticket(s)}
    <div class="btns"><button class="btn" data-close>ไม่ยกเลิก</button><button class="btn warn" id="cx">ยกเลิกคำขอ</button></div>`);
  $("#cx").onclick = async () => { try { const r = await API.rpc("cancel_booking", { p_slot_id: id }); if (r && r.id) S.slots.set(r.id, r); closeSheet(); render(); toast("ยกเลิกแล้ว"); } catch (e) { toast(e.message, "err"); } };
}

function adminSlot(s) {
  const opts = S.staff.filter(x => x.active).map(x => `<option value="${x.id}" ${x.id === s.staff_id ? "selected" : ""}>${esc(x.nickname)}</option>`).join("");
  const cur = ["approved", "pending"].includes(s.status) ? "assign" : s.status;
  openSheet(`<h3>จัดการช่อง</h3><p class="lead">สิทธิ์แอดมิน</p>${ticket(s)}
    ${s.status === "pending" ? `<div class="btns" style="margin-bottom:6px"><button class="btn warn" id="rj">ปฏิเสธ</button><button class="btn go" id="ap">อนุมัติคำขอ</button></div><hr class="sep">` : ""}
    <label class="field">ตั้งสถานะ<select id="as">
      <option value="open" ${cur === "open" ? "selected" : ""}>ว่าง (เปิดให้จอง)</option>
      <option value="full" ${cur === "full" ? "selected" : ""}>เต็มแล้ว</option>
      <option value="closed" ${cur === "closed" ? "selected" : ""}>ไม่รับคน</option>
      <option value="assign" ${cur === "assign" ? "selected" : ""}>ลงชื่อพนักงาน (อนุมัติทันที)</option></select></label>
    <label class="field ${cur === "assign" ? "" : "hidden"}" id="asw">พนักงาน<select id="ast"><option value="">— เลือก —</option>${opts}</select></label>
    <div class="btns"><button class="btn" data-close>ปิด</button><button class="btn pri" id="asv">บันทึก</button></div>`);
  $("#as").onchange = e => $("#asw").classList.toggle("hidden", e.target.value !== "assign");
  const ap = $("#ap"); if (ap) { ap.onclick = () => review(s.id, true); $("#rj").onclick = () => review(s.id, false); }
  $("#asv").onclick = async () => {
    const v = $("#as").value; const st = $("#ast").value;
    if (v === "assign" && !st) return toast("เลือกพนักงานก่อน", "err");
    try { const r = await API.rpc("admin_set_slot", { p_slot_id: s.id, p_status: v === "assign" ? "approved" : v, p_staff_id: v === "assign" ? st : null }); if (r && r.id) S.slots.set(r.id, r); closeSheet(); render(); toast("บันทึกแล้ว", "ok"); }
    catch (e) { toast(e.message, "err"); }
  };
}

/* ===== Sheet (modal) ===== */
function openSheet(html) {
  closeSheet();
  const d = document.createElement("div"); d.className = "scrim"; d.id = "scrim";
  d.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  d.addEventListener("click", e => { if (e.target === d || e.target.closest("[data-close]")) closeSheet(); });
  document.body.appendChild(d);
}
function closeSheet() { const d = $("#scrim"); if (d) d.remove(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

boot();
</script>
