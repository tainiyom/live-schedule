<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>ตารางไลฟ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface-2:#faf9f6; --ink:#1d1b18; --ink-2:#55514a; --ink-3:#8a857c;
  --line:#e6e2da; --line-2:#d6d1c6;
  --accent:#06c755; --accent-ink:#ffffff; --accent-soft:#e3f8eb;
  --open:#0a8f4a; --open-bg:#e6f6ec; --open-line:#9fdcb7;
  --full:#6b7280; --full-bg:#eef0f2;
  --closed:#a8a29e; --closed-bg:transparent;
  --pending:#b45309; --pending-bg:#fff4e0; --pending-line:#f5c97a;
  --danger:#d9342b; --danger-bg:#fdecea;
  --shadow:0 1px 2px rgba(30,25,15,.06),0 4px 16px rgba(30,25,15,.06);
  --r:12px;
  --divider:#c9c2b5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141412; --surface:#1d1c1a; --surface-2:#232220; --ink:#f1efe9; --ink-2:#b9b4aa; --ink-3:#8a857c;
  --line:#2f2d29; --line-2:#3c3a35; --accent-soft:#11331f;
  --open:#4fd18a; --open-bg:#143222; --open-line:#2d6b47; --full:#9aa1ab; --full-bg:#26282b;
  --pending:#f3b45a; --pending-bg:#3a2a12; --pending-line:#7a5520; --danger:#ff6b61; --danger-bg:#3a1916;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --divider:#4a4740;
}}
:root[data-theme="dark"]{
  --bg:#141412; --surface:#1d1c1a; --surface-2:#232220; --ink:#f1efe9; --ink-2:#b9b4aa; --ink-3:#8a857c;
  --line:#2f2d29; --line-2:#3c3a35; --accent-soft:#11331f;
  --open:#4fd18a; --open-bg:#143222; --open-line:#2d6b47; --full:#9aa1ab; --full-bg:#26282b;
  --pending:#f3b45a; --pending-bg:#3a2a12; --pending-line:#7a5520; --danger:#ff6b61; --danger-bg:#3a1916;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --divider:#4a4740;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink-3);padding:3px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.live.on i{background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2s infinite}
.live.on{color:var(--open)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.spacer{flex:1}
.me{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px;border-radius:99px}
.me img,.me .av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--line)}
.me .nm{font-weight:600;font-size:14px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .rl{font-size:11px;color:var(--ink-3);display:block;line-height:1}

.demo-bar{background:#1d1b18;color:#f5f4f0;font-size:13px}
.demo-bar .wrap{display:flex;gap:12px;align-items:center;min-height:38px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.demo-bar label{display:flex;gap:6px;align-items:center}

/* month + tabs */
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 0 10px}
.month{display:flex;align-items:center;gap:4px}
.month h1{font-size:22px;margin:0 6px;letter-spacing:-.02em;font-weight:700;min-width:150px;text-align:center}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px}
.icon-btn:hover{border-color:var(--line-2)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:500;color:var(--ink-2);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab.on{background:var(--ink);color:var(--bg)}
.badge{min-width:18px;height:18px;border-radius:99px;background:var(--pending);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:12.5px;color:var(--ink-3);font-weight:500}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.stat .s{font-size:12px;color:var(--ink-3)}
.stat.open .v{color:var(--open)} .stat.pend .v{color:var(--pending)}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent);width:16px;height:16px;margin:0}

/* legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin:0 0 12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend b{width:12px;height:12px;border-radius:4px;display:inline-block}

/* date strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:thin}
.dchip{flex:0 0 auto;width:54px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0 7px;text-align:center;scroll-snap-align:center;position:relative}
.dchip .wd{font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.dchip .wd i{width:6px;height:6px;border-radius:50%}
.dchip .dn{font-size:19px;font-weight:700;line-height:1.25}
.dchip .oc{font-size:10.5px;color:var(--open);font-weight:600;height:15px}
.dchip.past{opacity:.45}
.dchip.today{border-color:var(--ink)}
.dchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dchip.on .oc{color:var(--accent)}

/* day cards */
.day-title{display:flex;align-items:baseline;gap:10px;margin:6px 0 10px}
.day-title h2{margin:0;font-size:18px}
.day-title .sub{color:var(--ink-3);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.card-h{padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.card-h .sw{width:10px;height:28px;border-radius:4px}
.card-h .t{font-weight:700}
.card-h .st{font-size:12px;color:var(--ink-3)}
.srow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .tm{font-weight:600;font-size:14px;width:96px;flex:0 0 auto}
.srow .sl{flex:1;display:flex;justify-content:flex-end}

/* pills */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:96px;max-width:100%;height:30px;padding:0 12px;border-radius:99px;font-size:13.5px;font-weight:600;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;transition:transform .08s}
button.pill:active{transform:scale(.97)}
.p-open{background:var(--open-bg);color:var(--open);border-color:var(--open-line)}
button.p-open:hover{background:var(--open);color:#fff}
.p-full{background:var(--full-bg);color:var(--full)}
.p-overlap{background:var(--full-bg);color:var(--full);border:1px dashed var(--line-2);font-weight:500}
.p-wait{background:transparent;color:var(--open);border:1px dashed var(--open-line);font-weight:500;opacity:.8}
.p-closed{color:var(--closed);border:1px dashed var(--line-2);font-weight:500}
.p-pend{background:var(--pending-bg);color:var(--pending);border:1px dashed var(--pending-line)}
.p-name{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.p-mine{outline:2px solid var(--ink);outline-offset:1px}
.pill.past{opacity:.55}
.pill small{font-weight:500;font-size:11px;opacity:.85}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent)}20%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}

/* grid view */
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:calc(100vh - 150px);box-shadow:var(--shadow)}
table.g{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.g th,table.g td{padding:4px 5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
table.g thead th{position:sticky;background:var(--surface);z-index:2}
table.g thead tr.r1 th{top:0;height:34px;font-size:13.5px}
table.g thead tr.r2 th{top:34px;font-weight:600;font-size:12px;color:var(--ink-2);background:var(--surface-2)}
table.g th.ch{color:#1d1b18;border-left:3px solid var(--divider)}
table.g td.first,table.g th.first{position:sticky;left:0;background:var(--surface);z-index:3;text-align:left;padding-left:10px;border-right:1px solid var(--line);box-shadow:4px 0 6px -4px rgba(0,0,0,.18)}
table.g thead th.first{z-index:4}
table.g td.cl,table.g thead tr.r2 th.cl{border-left:3px solid var(--divider)}
table.g tr.past td>*{opacity:.45}
table.g tr.today td.first{box-shadow:inset 3px 0 0 var(--ink)}
table.g .pill{min-width:84px;height:26px;font-size:12.5px;padding:0 9px}
.dlab{display:flex;align-items:center;gap:8px;font-weight:600}
.dlab .wdp{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:99px;min-width:46px;text-align:center}

/* lists */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel + .panel{margin-top:14px}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h3{margin:0;font-size:16px}
.panel-h .sub{color:var(--ink-3);font-size:13px}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .when{width:62px;flex:0 0 auto;text-align:center}
.li .when .d{font-size:20px;font-weight:700;line-height:1.1}
.li .when .w{font-size:11.5px;font-weight:600}
.li .what{flex:1;min-width:0}
.li .what .a{font-weight:600}
.li .what .b{font-size:13px;color:var(--ink-3)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:7px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.go{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.warn{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:var(--danger-bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:12px 18px;font-size:16px;border-radius:12px;width:100%}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* summary bars */
.bars{padding:8px 16px 14px}
.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;padding:5px 0}
.bar .n{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:20px;background:var(--surface-2);border-radius:6px;overflow:hidden;display:flex}
.bar .fill{height:100%;border-radius:6px 0 0 6px}
.bar .fill.p{background:repeating-linear-gradient(45deg,var(--pending-line) 0 4px,transparent 4px 8px);border-radius:0}
.bar .c{font-size:13.5px;text-align:right;font-weight:600}
.bar .c small{color:var(--pending);font-weight:500}

/* per-person month view */
.bar.clickable{cursor:pointer;border-radius:8px;padding:5px 6px;margin:0 -6px}
.bar.clickable:hover{background:var(--surface-2)}
.bar.sel{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--ink)}
.pstats{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px 4px}
.pstats div{flex:1;min-width:68px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.pstats span{display:block;font-size:12px;color:var(--ink-3)}
.pstats b{font-size:22px;letter-spacing:-.02em}
.chsum{display:flex;gap:6px 14px;flex-wrap:wrap;padding:8px 16px 0;font-size:13px;color:var(--ink-2)}
.chsum i,.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cal{padding:14px 16px}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h div{text-align:center;font-size:12px;font-weight:700;padding-bottom:4px}
.cal-d{min-height:78px;border:1px solid var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.cal-d.empty{border:0;background:none}
.cal-d.has{background:var(--surface-2)}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-n{font-size:12px;font-weight:700}
.cal-chip{font-size:10.5px;line-height:1.25;color:#1d1b18;border-radius:5px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-chip.lv{background:transparent!important;border:1px dashed var(--line-2);color:var(--ink-3)}
.cal-chip.pend{background:repeating-linear-gradient(45deg,#fff4e0 0 4px,#ffe2b0 4px 8px)!important;border:1px dashed #d08a2a}
@media (max-width:640px){
  .cal-d{min-height:46px;padding:3px}
  .cal-chip{height:6px;padding:0;font-size:0}
}
.plist{border-top:1px solid var(--line)}
@media (min-width:641px){.plist{display:none}}

@media (max-width:640px){.li{flex-wrap:wrap}.li .row-actions{width:100%;padding-left:74px;justify-content:flex-start}.li .row-actions .btn{flex:1}}
.newver{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);font-size:14px;width:max-content;max-width:calc(100% - 24px)}
/* live now */
.livebox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin:6px 0 12px;overflow:hidden}
.livebox.empty-live{display:flex;gap:10px;align-items:center;padding:12px 16px;color:var(--ink-3);font-size:14px;box-shadow:none}
.live-h{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.live-h b{font-size:15px}.live-h .sub{color:var(--ink-3);font-size:12.5px;margin-left:auto}
.ldot{width:9px;height:9px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 0 rgba(229,72,77,.6);animation:lpulse 1.6s infinite;flex:0 0 auto}
.ldot.off{background:var(--ink-3);animation:none}
@keyframes lpulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.55)}70%{box-shadow:0 0 0 7px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
.live-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.live-r{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.live-r .sw{width:6px;align-self:stretch;border-radius:3px;flex:0 0 auto}
.live-c{flex:1;min-width:0}
.live-ch{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-t{font-size:12px;color:var(--ink-3);white-space:nowrap}
.live-who{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.live-next{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.live-next b{color:var(--ink-2);font-weight:600}
.nonext{color:var(--danger);font-weight:600}
/* audit log */
.logf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 12px;padding:14px 16px 0}
.logf select{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14px}
.loglist{border-top:1px solid var(--line)}
.logd{padding:10px 16px 4px;font-size:12.5px;font-weight:700;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
.logr{display:flex;gap:10px;align-items:baseline;padding:8px 16px;border-bottom:1px solid var(--line);font-size:14px}
.logr .lt{flex:0 0 auto;width:92px;color:var(--ink-3);font-size:12.5px}
.logr .lx{flex:1;min-width:0;line-height:1.5}
.logr .lx s{color:var(--ink-3)}
.logr .lx b.be{color:var(--pending)}
.logr .lc{flex:0 0 auto;font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:99px;padding:1px 7px}
.sheet .loglist{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.sheet .logr .lt{width:auto}
@media (max-width:640px){.logr{flex-wrap:wrap;gap:2px 10px}.logr .lt{width:auto}.logr .lx{flex-basis:100%;order:3}}
/* leave */
.lv-line{margin-top:4px;font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lv-link{color:var(--ink-3);text-decoration:underline;text-underline-offset:2px}
.lv-st{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.lv-pending{background:var(--pending-bg);color:var(--pending);border-color:var(--pending-line)}
.lv-approved{background:var(--full-bg);color:var(--ink-2)}
.lv-rejected{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.lv-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.lv-opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.lv-opt:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.lv-opt input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--ink)}
.lv-opt b{display:block;font-size:15px}

.btns{display:flex;gap:8px}
.btns .btn{flex:1;padding:11px 14px;font-size:15px;border-radius:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13.5px;color:var(--ink-2)}

.note{font-size:12.5px;color:var(--ink-3);margin-top:10px}

let sb = null;

function makeLiveApi() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  return {
    async config() { const { data } = await sb.rpc("get_public_config"); return data || {}; },
    async session() { const { data } = await sb.auth.getSession(); return data.session; },
    async loadBase() {
      const [c, sh, st] = await Promise.all([
        sb.from("channels").select("*").order("sort_order"),
        sb.from("shifts").select("*").order("sort_order"),
        sb.from("staff").select("*").order("nickname")]);
      for (const r of [c, sh, st]) if (r.error) throw r.error;
      return { channels: c.data, shifts: sh.data, staff: st.data };
    },
    async loadMonth(y, m) {
      const { data, error } = await sb.from("slots").select("*").gte("work_date", ymd(y, m, 1)).lte("work_date", ymd(y, m, daysIn(y, m)));
      if (error) throw error; return data;
    },
    async loadRange(from, to) {
      const out = []; const step = 1000;
      for (let i = 0; ; i += step) {
        const { data, error } = await sb.from("slots").select("*").gte("work_date", from).lte("work_date", to)
          .not("staff_id", "is", null).order("work_date").order("id").range(i, i + step - 1);
        if (error) throw error; out.push(...data); if (data.length < step) break;
      }
      return out;
    },
    async loadAudit(fromIso, toIso, beforeId) {
      let q = sb.from("audit_log").select("*").gte("at", fromIso).lt("at", toIso).order("id", { ascending: false }).limit(400);
      if (beforeId) q = q.lt("id", beforeId);
      const { data, error } = await q; if (error) throw error; return data;
    },
    async slotHistory(id) { const { data, error } = await sb.rpc("slot_history", { p_slot_id: id }); if (error) throw error; return data; },
    async loadLeaves(from, to) {
      const { data, error } = await sb.from("leaves").select("*").gte("work_date", from).lte("work_date", to).order("requested_at");
      if (error) throw error; return data;
    },
    async loadPay(periodStart) {
      const [c, st, it, op] = await Promise.all([sb.from("pay_config").select("*"), sb.from("pay_staff").select("*"),
        sb.from("pay_items").select("*").eq("period_start", periodStart).order("id"), sb.from("pay_slot_opts").select("*").limit(20000)]);
      for (const r of [c, st, it, op]) if (r.error) throw r.error;
      return { config: c.data, staff: st.data, items: it.data, opts: op.data };
    },
    async rpc(name, args) {
      const { data, error } = await sb.rpc(name, args);
      if (error) throw new Error(error.message); return data;
    },
    subscribe(onEvt, onStatus) {
      sb.channel("live").on("postgres_changes", { event: "*", schema: "public", table: "slots" }, p => onEvt("slots", p))
        .on("postgres_changes", { event: "*", schema: "public", table: "staff" }, p => onEvt("staff", p))
        .on("postgres_changes", { event: "*", schema: "public", table: "leaves" }, p => onEvt("leaves", p))
        .subscribe(st => onStatus(st === "SUBSCRIBED"));
    },
    async signOut() { await sb.auth.signOut(); }
  };
}

/* ===== LINE login (LIFF) ===== */
let LIFF_ID = "";
function loadLiff() {
  return new Promise((res, rej) => {
    if (window.liff) return res();
    const s = document.createElement("script"); s.src = "https://static.line-scdn.net/liff/edge/2/sdk.js";
    s.onload = res; s.onerror = () => rej(new Error("โหลด LINE SDK ไม่สำเร็จ")); document.head.appendChild(s);
  });
}
async function lineExchange() {
  const idToken = liff.getIDToken();
  if (!idToken) throw new Error("ไม่ได้รับ ID token จาก LINE (ตรวจสอบว่าเปิด scope openid แล้ว)");
  const r = await fetch(`${SUPABASE_URL}/functions/v1/line-login`, {
    method: "POST", headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
    body: JSON.stringify({ id_token: idToken })
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { liff.logout(); liff.login({ redirectUri: location.href.split("#")[0] }); throw new Error("กำลังเข้าสู่ระบบใหม่…"); }
  if (!r.ok) throw new Error(j.error || "เข้าสู่ระบบไม่สำเร็จ");
  const { error } = await sb.auth.setSession({ access_token: j.access_token, refresh_token: j.refresh_token });
  if (error) throw error;
}

async function boot() {
  try {
    const cfg = await API.config(); LIFF_ID = cfg.liff_id || "";

    if (!session && !DEMO) {
      if (!LIFF_ID) return renderLogin("ยังไม่ได้ตั้งค่า LINE Login — ผู้ดูแลต้องใส่ LIFF ID ก่อน");
      await loadLiff(); await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) { renderLoading("กำลังเข้าสู่ระบบด้วย LINE…"); await lineExchange(); session = await API.session(); }
      else return renderLogin();
    }
    S.user = session.user;
    await loadBase();
    S.me = S.staff.find(s => s.auth_user_id === S.user.id) || null;
    if (!S.me) return renderClaim();
    startApp();
  } catch (e) { console.error(e); renderLogin(e.message || String(e)); }
}

/* ===== App ===== */
async function startApp() {
  const t = parseD(todayStr());
  if (!S.y) { S.y = t.y; S.m = t.m; S.sel = todayStr(); }
  renderShell();
  await loadMonth();
  API.subscribe(onRealtime, on => { S.live = on; const l = $("#live"); if (l) { l.classList.toggle("on", on); l.lastChild.textContent = on ? "อัปเดตสด" : "กำลังเชื่อมต่อ…"; } });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") loadMonth(true); });
  setInterval(checkVersion, 5 * 60000); setTimeout(checkVersion, 4000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkVersion(); });
  setInterval(async () => { if (S._nowDay !== todayStr()) { S._nowDay = todayStr(); await loadNowWindow(); } const lp = $("#livePanel"); if (lp) lp.innerHTML = livePanelHtml(); }, 60000);
}

function bkkShift(days) { return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Bangkok" }).format(new Date(Date.parse(todayStr() + "T12:00:00+07:00") + days * 864e5)); }
async function loadNowWindow() {
  try { const rows = await API.loadRange(bkkShift(-1), bkkShift(1)); S.nowSlots = new Map(rows.map(r => [r.id, r])); } catch (e) {}
}

async function loadMonth(silent) {
  try {
    const [rows, lv] = await Promise.all([API.loadMonth(S.y, S.m), API.loadLeaves(ymd(S.y, S.m, 1), ymd(S.y, S.m, daysIn(S.y, S.m))).catch(() => [])]);
    S.slots = new Map(rows.map(r => [r.id, r]));
    S.leaves = new Map(lv.map(r => [r.id, r]));
    await loadNowWindow();
    render();
  } catch (e) { if (!silent) toast("โหลดข้อมูลไม่สำเร็จ: " + e.message, "err"); }
}

function onRealtime(table, p) {
  if (table === "staff") {
    const r = p.new && p.new.id ? p.new : null;
    if (r) { const i = S.staff.findIndex(s => s.id === r.id); if (i >= 0) S.staff[i] = r; else S.staff.push(r); if (S.me && r.id === S.me.id) S.me = r; }
    return render();
  }
  if (table === "leaves") {
    if (p.eventType === "DELETE") { S.leaves.delete(p.old.id); return render(); }
    const l = p.new; const prevL = S.leaves.get(l.id);
    if (l.work_date.startsWith(`${S.y}-${pad(S.m)}-`)) S.leaves.set(l.id, l);
    if (S.me && l.staff_id === S.me.id && prevL && prevL.status === "pending" && l.status !== "pending" && !isAdmin()) {
      if (l.status === "approved") toast(`อนุมัติการลาแล้ว: ${l.channel_name} ${l.shift_label}`, "ok");
      else if (l.status === "rejected") toast(`คำขอลาไม่ได้รับอนุมัติ — กะ ${l.shift_label} ยังเป็นของคุณ`, "err");
    }
    return render();
  }
  if (p.eventType === "DELETE") { S.slots.delete(p.old.id); return render(); }
  const r = p.new; const prev = S.slots.get(r.id);
  const inMonth = r.work_date.startsWith(`${S.y}-${pad(S.m)}-`);
  if (inMonth) { S.slots.set(r.id, r); S.flash.add(r.id); }
  if (r.work_date >= bkkShift(-1) && r.work_date <= bkkShift(1)) { if (r.staff_id) S.nowSlots.set(r.id, r); else S.nowSlots.delete(r.id); }
  if (prev && S.me && prev.staff_id === S.me.id && prev.status === "pending") {
    const label = slotLabel(r);
    if (r.status === "approved") toast(`✓ อนุมัติแล้ว: ${label}`, "ok");
    else if (r.status === "open") toast(`คำขอถูกปฏิเสธ/ยกเลิก: ${label}`, "err");
  }
  render();

/* lookups */
const shiftById = id => S.shifts.find(s => s.id === id);
const chanById = id => S.channels.find(c => c.id === id);
const staffById = id => S.staff.find(s => s.id === id);
const isAdmin = () => S.me && S.me.role === "admin";
/* leave helpers */
const LEAVE_TXT = { sick: "ลาป่วย", sudden: "ลากะทันหัน", advance: "ลาล่วงหน้า 2 วัน" };
const LEAVE_DESC = { sick: "ไม่สบาย เข้ากะไม่ไหว", sudden: "ติดธุระด่วน แจ้งก่อนเริ่มกะไม่ถึง 2 วัน", advance: "แจ้งก่อนเริ่มกะอย่างน้อย 48 ชั่วโมง" };
const LEAVE_STATUS = { pending: "รออนุมัติ", approved: "อนุมัติแล้ว", rejected: "ไม่อนุมัติ", cancelled: "ยกเลิกแล้ว" };
function shiftStartMs(slot) { const sh = shiftById ? shiftById(slot.shift_id) : null; const label = sh ? sh.label : ""; const r = String(label).match(/(\d{1,2})[.:](\d{2})/); return Date.parse(`${slot.work_date}T00:00:00+07:00`) + (r ? (+r[1] * 60 + +r[2]) * 60000 : 0); }
const pendingLeaveOf = slotId => [...S.leaves.values()].find(l => l.slot_id === slotId && l.status === "pending");
const workers = () => S.staff.filter(s => s.active && s.role !== "admin");
/* booking priority: KCM → warawut → NAGA Care → TINN Care (same date + same shift time) */
const PRIO_FALLBACK = { kcm: 1, warawut: 2, naga: 3, tinn: 4 };
const prioOf = c => (c && (c.priority ?? PRIO_FALLBACK[c.code])) || null;
/* overlap rule: same channel + same date, overlapping time already taken (pending/approved) */
function rangeOf(label) {
  const m = String(label).match(/(\d{1,2})[.:](\d{2})\s*-\s*(\d{1,2})[.:](\d{2})/); if (!m) return null;
  const a = +m[1] * 60 + +m[2]; let b = +m[3] * 60 + +m[4]; if (b <= a) b += 1440; return [a, b];
}
const rOverlap = (x, y) => x && y && x[0] < y[1] && y[0] < x[1];
function overlapTaker(s) {
  if (!s) return null; const sh = shiftById(s.shift_id); const r = rangeOf(sh.label);
  for (const x of S.slots.values()) {
    if (x.id === s.id || x.work_date !== s.work_date || !["pending", "approved"].includes(x.status)) continue;
    const xsh = shiftById(x.shift_id); if (xsh.channel_id !== sh.channel_id) continue;
    if (rOverlap(r, rangeOf(xsh.label))) return { slot: x, sh: xsh, st: staffById(x.staff_id) };
  }
  return null;
}
function overlapAlternatives(s) {
  const sh = shiftById(s.shift_id); const r = rangeOf(sh.label);
  return [...S.slots.values()].filter(x => x.id !== s.id && x.work_date === s.work_date && x.status === "open")
    .filter(x => { const xsh = shiftById(x.shift_id); return xsh.channel_id === sh.channel_id && rOverlap(r, rangeOf(xsh.label)) && !overlapTaker(x); })
    .sort((a, b) => shiftById(a.shift_id).sort_order - shiftById(b.shift_id).sort_order);
}
const bookable = s => s && s.status === "open" && s.work_date >= todayStr() && !overlapTaker(s);

function blockerFor(s) {
  if (!s || s.status !== "open") return null;
  const sh = shiftById(s.shift_id); const myP = prioOf(chanById(sh.channel_id)); if (!myP) return null;
  let best = null;
  for (const x of S.slots.values()) {
    if (x.work_date !== s.work_date || x.status !== "open" || x.id === s.id || overlapTaker(x)) continue;
    const xsh = shiftById(x.shift_id); if (xsh.label !== sh.label) continue;
    const p = prioOf(chanById(xsh.channel_id)); if (p && p < myP && (!best || p < best.p)) best = { p, slot: x, ch: chanById(xsh.channel_id) };
  }
  return best;
}
const prioLine = () => S.channels.filter(c => prioOf(c)).sort((a, b) => prioOf(a) - prioOf(b)).map(c => c.name).join(" → ");
function slotLabel(s) { const sh = shiftById(s.shift_id); const ch = chanById(sh.channel_id); return `${ch.name} ${sh.label} · ${thDate(s.work_date)}`; }
function slotIndex() {
  const idx = {}; for (const s of S.slots.values()) (idx[s.work_date] ||= {})[s.shift_id] = s; return idx;
}

function shiftMonth(d) {

function pill(s, compact) {
  if (!s) return `<span class="pill p-closed">—</span>`;
  const past = s.work_date < todayStr() ? " past" : "";
  const fl = S.flash.has(s.id) ? " flash" : "";
  if (s.status === "open") {
    if (past) return `<span class="pill p-closed${past}">ว่าง (ผ่านแล้ว)</span>`;
    const ov = overlapTaker(s);
    if (ov && !isAdmin()) return `<button class="pill p-full${fl}" data-slot="${s.id}" title="ทับกับกะ ${ov.sh.label} ที่มีคนลงแล้ว">เต็มแล้ว</button>`;
    const bl = !isAdmin() && blockerFor(s);
    if (bl) return `<button class="pill p-wait${fl}" data-slot="${s.id}" title="ต้องลงช่อง ${esc(bl.ch.name)} ก่อน">${compact ? "รอ " + esc(bl.ch.name.split(" ")[0]) : "ว่าง · ลง " + esc(bl.ch.name) + " ก่อน"}</button>`;
    return `<button class="pill p-open${fl}" data-slot="${s.id}">${compact ? "ว่าง" : "ว่าง · จอง"}</button>`;
  }
  const tag = (isAdmin() || s.staff_id === S.me.id) ? "button" : "span";
  const at = tag === "button" ? ` data-slot="${s.id}"` : "";
  if (s.status === "full") return isAdmin() ? `<button class="pill p-full${past}${fl}" data-slot="${s.id}">เต็มแล้ว</button>` : `<span class="pill p-full${past}">เต็มแล้ว</span>`;
  if (s.status === "closed") return isAdmin() ? `<button class="pill p-closed${past}${fl}" data-slot="${s.id}">ไม่รับคน</button>` : `<span class="pill p-closed${past}">ไม่รับคน</span>`;
  const st = staffById(s.staff_id) || { nickname: "?", bg_color: "#999", fg_color: "#fff" };
  const mine = s.staff_id === S.me.id ? " p-mine" : "";
  if (s.status === "pending") return `<${tag} class="pill p-pend${mine}${past}${fl}"${at} title="รออนุมัติ">${esc(st.nickname)} <small>รออนุมัติ</small></${tag}>`;
  const lvTag = (isAdmin() || s.staff_id === S.me.id) && pendingLeaveOf(s.id) ? ` <span class="lvtag">ลา?</span>` : "";
  return `<${tag} class="pill p-name${mine}${past}${fl}"${at} style="background:${st.bg_color};color:${st.fg_color}">${esc(st.nickname)}${lvTag}</${tag}>`;
}

function stats() {
  const t = todayStr(); let open = 0, pend = 0, mine = 0, minePend = 0, openToday = 0;
  for (const s of S.slots.values()) {
    if (bookable(s)) { open++; if (s.work_date === t) openToday++; }
    if (s.status === "pending") pend++;
    if (s.staff_id === S.me.id) { if (s.status === "approved") mine++; else if (s.status === "pending") minePend++; }
  }
  return { open, pend, mine, minePend, openToday };
}

/* ===== New-version check (beats phone / LINE caching) ===== */
async function checkVersion() {
  if (DEMO || location.protocol === "file:" || S._newVer) return;
  try {
    const r = await fetch(location.pathname + "?vcheck=" + Date.now(), { cache: "no-store" }); const t = await r.text();
    const m = t.match(/APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION) {
      S._newVer = m[1];
      const bar = document.createElement("div"); bar.className = "newver";

      bar.querySelector("button").onclick = () => { location.href = location.pathname + "?v=" + encodeURIComponent(m[1]) + location.hash; };
      document.body.appendChild(bar);

}

const fmtLeft = ms => { const m = Math.max(0, Math.round(ms / 60000)); const h = Math.floor(m / 60); return h ? `${h} ชม.${m % 60 ? ` ${m % 60} นาที` : ""}` : `${m} นาที`; };

  body.innerHTML = `<div class="panel"><div class="panel-h"><h3>สรุปของฉัน</h3><span class="sub">${TH_MONTHS[S.m - 1]} ${S.y + 543} · นับเฉพาะกะที่อนุมัติแล้ว</span></div>
    <div class="pstats" style="padding-bottom:14px">
      <div><span>วันที่ทำงาน</span><b class="tnum">${new Set(appr.map(s => s.work_date)).size}</b></div>

      <div><span>เข้ากะตามตาราง</span><b class="tnum" style="color:${attend === 100 ? "var(--open)" : "var(--ink)"}">${attend}%</b></div>
    </div>
    <div class="note" style="padding:0 16px 14px;margin:0">ทำไปแล้ว ${done.length} กะ (${sumH(done)} ชม.) · ที่จะถึง ${next.length} กะ (${sumH(next)} ชม.)</div></div>
    <div class="panel"><div class="panel-h"><h3>กะที่จะถึง</h3><span class="sub">${up.length} กะ</span></div>${up.map(row).join("") || `<div class="empty">ยังไม่มีกะที่จะถึงในเดือนนี้ — ไปที่ "ภาพรวม" แล้วกดช่องสีเขียวเพื่อจอง</div>`}</div>
    ${past.length ? `<div class="panel"><div class="panel-h"><h3>ผ่านไปแล้ว</h3><span class="sub">${past.length} กะ</span></div>${past.map(row).join("")}</div>` : ""}
    ${myLeaves.length ? `<div class="panel"><div class="panel-h"><h3>การแจ้งลาของฉัน</h3><span class="sub">${TH_MONTHS[S.m - 1]}</span></div>${myLeaves.map(l => { const p = parseD(l.work_date);
      return `<div class="li"><div class="when"><div class="w" style="color:${WD_COLOR[p.wd]}">${WD[p.wd]}</div><div class="d tnum">${p.d}</div></div>
      <div class="what"><div class="a">${LEAVE_TXT[l.leave_type]} · ${esc(l.channel_name)} <span class="tnum">${l.shift_label}</span></div><div class="b">${esc(l.reason || "")}</div></div>
      <span class="lv-st lv-${l.status}">${LEAVE_STATUS[l.status]}</span></div>`; }).join("")}</div>` : ""}`;

function renderSummary(body) {
  const n = daysIn(S.y, S.m);
  const ranges = { a: [1, 15], b: [16, n], all: [1, n] };
  const [d1, d2] = ranges[S.sumRange]; const from = ymd(S.y, S.m, d1), to = ymd(S.y, S.m, d2);
  const cnt = {}; for (const s of S.slots.values()) if (s.staff_id && s.work_date >= from && s.work_date <= to) { const c = (cnt[s.staff_id] ||= { a: 0, p: 0 }); s.status === "approved" ? c.a++ : c.p++; }
  const rows = workers().map(s => ({ s, ...(cnt[s.id] || { a: 0, p: 0 }) })).sort((x, y) => (y.a + y.p) - (x.a + x.p) || x.s.nickname.localeCompare(y.s.nickname, "th"));
  const max = Math.max(1, ...rows.map(r => r.a + r.p));
  body.innerHTML = `<div class="panel"><div class="panel-h"><h3>จำนวนกะต่อคน</h3><span class="sub">${d1}–${d2} ${TH_MON_S[S.m - 1]}</span><div class="spacer"></div>
    <div class="seg"><button data-r="a" class="${S.sumRange === "a" ? "on" : ""}">1–15</button><button data-r="b" class="${S.sumRange === "b" ? "on" : ""}">16–${n}</button><button data-r="all" class="${S.sumRange === "all" ? "on" : ""}">ทั้งเดือน</button></div></div>
    <div class="bars">${rows.map(r => `<div class="bar ${isAdmin() ? "clickable" : ""} ${isAdmin() && S.person === r.s.id ? "sel" : ""}" ${isAdmin() ? `data-person="${r.s.id}"` : ""}><span class="n">${esc(r.s.nickname)}</span><span class="track"><span class="fill" style="width:${r.a / max * 100}%;background:${r.s.bg_color}"></span><span class="fill p" style="width:${r.p / max * 100}%"></span></span><span class="c tnum">${r.a}${r.p ? ` <small>+${r.p}</small>` : ""}</span></div>`).join("")}</div>
    <div class="note" style="padding:0 16px 14px">นับเฉพาะกะที่มีชื่อ · ส่วนลายทาง = รออนุมัติ${isAdmin() ? " · <b>กดที่ชื่อเพื่อดูรายละเอียดทั้งเดือน</b>" : ""}</div></div>
    ${isAdmin() ? `<div id="personBox"></div>` : ""}`;
  body.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { S.sumRange = b.dataset.r; render(); });
  if (isAdmin()) {
    if (!S.person || !workers().some(w => w.id === S.person)) S.person = rows[0]?.s.id;
    body.querySelectorAll("[data-person]").forEach(b => b.onclick = () => { S.person = b.dataset.person; render(); setTimeout(() => $("#personBox")?.scrollIntoView({ behavior: "smooth", block: "start" }), 0); });
    renderPerson($("#personBox"));
  }
}

/* ===== Payroll export ===== */
function shiftHours(label) {
  const m = String(label).match(/(\d{1,2})[.:](\d{2})\s*-\s*(\d{1,2})[.:](\d{2})/); if (!m) return { start: "", end: "", h: 0 };
  const a = +m[1] * 60 + +m[2]; let b = +m[3] * 60 + +m[4]; if (b <= a) b += 24 * 60;
  return { start: `${m[1]}.${m[2]}`, end: `${m[3]}.${m[4]}`, h: Math.round((b - a) / 60 * 100) / 100 };
}
function loadXLSX() {
  return new Promise((res, rej) => {
    if (window.XLSX) return res();
    const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload = res; s.onerror = () => rej(new Error("โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ")); document.head.appendChild(s);
  });
}
async function exportPayroll(from, to, inclPending) {
  if (!from || !to || from > to) return toast("ช่วงวันที่ไม่ถูกต้อง", "err");
  const btn = $("#xGo"); btn.disabled = true; btn.textContent = "กำลังสร้างไฟล์…";
  try {
    const [rows, lvAll] = await Promise.all([API.loadRange(from, to), API.loadLeaves(from, to), loadXLSX()]);
    const use = rows.filter(s => s.status === "approved" || (inclPending && s.status === "pending"));
    const lvUse = lvAll.filter(l => l.status === "approved");
    if (!use.length && !lvUse.length) throw new Error("ไม่มีกะที่มีชื่อพนักงานในช่วงนี้");
    const chans = [...S.channels].sort((a, b) => a.sort_order - b.sort_order);
    const detail = use.map(s => {
      const sh = shiftById(s.shift_id); const c = chanById(sh.channel_id); const st = staffById(s.staff_id) || {}; const hh = shiftHours(sh.label); const p = parseD(s.work_date);
      return { _ord: [s.work_date, c.sort_order, sh.sort_order], "วันที่": s.work_date, "วัน": WD[p.wd], "ช่อง": c.name, "กะ": sh.label, "เริ่ม": hh.start, "สิ้นสุด": hh.end, "ชั่วโมง": hh.h,
        "พนักงาน": st.nickname || "?", "สถานะ": STATUS_TXT[s.status], "อนุมัติเมื่อ": s.approved_at ? new Date(s.approved_at).toLocaleString("th-TH", { timeZone: "Asia/Bangkok" }) : "" };
    }).sort((x, y) => x._ord[0].localeCompare(y._ord[0]) || x._ord[1] - y._ord[1] || x._ord[2] - y._ord[2]).map(({ _ord, ...r }) => r);
    const per = {};
    for (const r of detail) {
      const o = (per[r["พนักงาน"]] ||= { "พนักงาน": r["พนักงาน"], "จำนวนกะ": 0, "ชั่วโมงรวม": 0, _days: new Set() });
      o["จำนวนกะ"]++; o["ชั่วโมงรวม"] += r["ชั่วโมง"]; o._days.add(r["วันที่"]);
      o[`${r["ช่อง"]} (กะ)`] = (o[`${r["ช่อง"]} (กะ)`] || 0) + 1; o[`${r["ช่อง"]} (ชม.)`] = (o[`${r["ช่อง"]} (ชม.)`] || 0) + r["ชั่วโมง"];
    }
    for (const l of lvUse) {
      const nm = staffById(l.staff_id)?.nickname || "?";
      const o = (per[nm] ||= { "พนักงาน": nm, "จำนวนกะ": 0, "ชั่วโมงรวม": 0, _days: new Set() });
      const k = LEAVE_TXT[l.leave_type]; o[`${k} (ครั้ง)`] = (o[`${k} (ครั้ง)`] || 0) + 1; o[`${k} (ชม.)`] = (o[`${k} (ชม.)`] || 0) + Number(l.hours);
    }
    const sum = Object.values(per).sort((a, b) => b["ชั่วโมงรวม"] - a["ชั่วโมงรวม"]).map(o => {
      const r = { "พนักงาน": o["พนักงาน"], "จำนวนวันที่ทำงาน": o._days.size, "จำนวนกะ": o["จำนวนกะ"], "ชั่วโมงรวม": o["ชั่วโมงรวม"] };
      for (const c of chans) { r[`${c.name} (กะ)`] = o[`${c.name} (กะ)`] || 0; r[`${c.name} (ชม.)`] = o[`${c.name} (ชม.)`] || 0; }
      for (const k of ["sick", "sudden", "advance"]) { const t = LEAVE_TXT[k]; r[`${t} (ครั้ง)`] = o[`${t} (ครั้ง)`] || 0; r[`${t} (ชม.)`] = o[`${t} (ชม.)`] || 0; }
      return r;
    });
    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.json_to_sheet(sum); ws1["!cols"] = Object.keys(sum[0]).map(k => ({ wch: Math.max(10, k.length + 4) }));
    const ws2 = XLSX.utils.json_to_sheet(detail); ws2["!cols"] = [12, 9, 16, 13, 7, 7, 8, 14, 12, 20].map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws1, "สรุปรายคน");
    XLSX.utils.book_append_sheet(wb, ws2, "รายละเอียดกะ");
    const lvRows = lvUse.sort((a, b) => a.work_date.localeCompare(b.work_date)).map(l => ({ "วันที่": l.work_date, "วัน": WD[parseD(l.work_date).wd], "พนักงาน": staffById(l.staff_id)?.nickname || "?",
      "ประเภท": LEAVE_TXT[l.leave_type], "ช่อง": l.channel_name, "กะ": l.shift_label, "ชั่วโมง": Number(l.hours), "เหตุผล": l.reason || "",
      "แจ้งเมื่อ": new Date(l.requested_at).toLocaleString("th-TH", { timeZone: "Asia/Bangkok" }), "แจ้งก่อนเริ่มกะ (ชม.)": l.shift_start ? Math.round((Date.parse(l.shift_start) - Date.parse(l.requested_at)) / 3600e3) : "",
      "บันทึกโดยแอดมิน": l.recorded_by_admin ? "ใช่" : "" }));
    const ws3 = XLSX.utils.json_to_sheet(lvRows.length ? lvRows : [{ "วันที่": "", "พนักงาน": "ไม่มีการลาในช่วงนี้" }]);
    ws3["!cols"] = [12, 9, 14, 16, 16, 13, 8, 30, 20, 18, 14].map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws3, "การลา");
    XLSX.writeFile(wb, `ตารางไลฟ์_${from}_ถึง_${to}.xlsx`);
    toast(`ดาวน์โหลดแล้ว ${detail.length} กะ / ${sum.length} คน`, "ok");
  } catch (e) { toast(e.message, "err"); }
  finally { btn.disabled = false; btn.textContent = "⬇ ดาวน์โหลด Excel"; }
}

function openSlot(id) {
  const s = S.slots.get(id); if (!s) return;

    const ov = overlapTaker(s);

      const alts = overlapAlternatives(s).filter(x => !blockerFor(x));
      openSheet(`<h3>กะนี้เต็มแล้ว</h3>
        <p class="lead">${esc(chanById(shiftById(s.shift_id).channel_id).name)} วันเดียวกัน กะ <b>${ov.sh.label}</b> มี <b>${esc(ov.st?.nickname || "คน")}</b> ลงไว้แล้ว${ov.slot.status === "pending" ? " (รออนุมัติ)" : ""} จึงลงกะ <b>${shiftById(s.shift_id).label}</b> ไม่ได้${alts.length ? `<br>ลงกะ <b>${alts.map(a => shiftById(a.shift_id).label).join(", ")}</b> แทนได้` : ""}</p>

        ${ticket(bl.slot)}

/* ===== Audit log ===== */
const LOG_CAT = { slots: "กะ", leaves: "การลา", staff: "พนักงาน", channels: "ตั้งค่า", shifts: "ตั้งค่า", app_config: "ตั้งค่า", pay_config: "เงินเดือน", pay_staff: "เงินเดือน", pay_items: "เงินเดือน", pay_slot_opts: "เงินเดือน" };
const shortDate = ds => { if (!ds) return ""; const p = parseD(ds); return `${WD_S[p.wd]} ${p.d} ${TH_MON_S[p.m - 1]}`; };
const nameOf = id => id ? (staffById(id)?.nickname || "?") : "";
function slotDesc(d) { if (!d) return ""; const sh = shiftById(d.shift_id); const c = sh && chanById(sh.channel_id); return `${c ? c.name : "?"} ${sh ? sh.label : ""} · ${shortDate(d.work_date)}`; }
function slotState(d) {
  if (!d) return "-";
  return { open: "ว่าง", full: "เต็มแล้ว", closed: "ไม่รับคน", pending: `${nameOf(d.staff_id)} (รออนุมัติ)`, approved: nameOf(d.staff_id) }[d.status] || d.status;
}
function describeLog(e) {
  const o = e.old_data || {}, n = e.new_data || {}; const ch = e.changed || [];
  const actor = e.actor_name || (e.source === "backend" ? "ระบบหลังบ้าน" : "ไม่ทราบ");
  let text = "";
  if (e.table_name === "slots") {
    if (e.op === "INSERT") text = `สร้างช่อง ${slotDesc(n)} (${slotState(n)})`;
    else if (e.op === "DELETE") text = `ลบช่อง ${slotDesc(o)}`;
    else {
      let verb = "แก้ไขช่อง";
      if (o.status === "open" && n.status === "pending" && n.staff_id === e.actor_staff) verb = "จองกะ";
      else if (o.status === "pending" && n.status === "approved") verb = "อนุมัติการจอง";
      else if (o.status === "pending" && n.status === "open") verb = o.staff_id === e.actor_staff ? "ยกเลิกการจอง" : "ปฏิเสธการจอง";
      else if (o.status === "approved" && n.status === "open") verb = "เอาชื่อออก";
      else if (n.status === "approved" && o.staff_id !== n.staff_id) verb = "ลงชื่อ";
      text = `${verb} — ${slotDesc(n)}: <s>${esc(slotState(o))}</s> → <b>${esc(slotState(n))}</b>`;
      return { actor, text, cat: "กะ" };
    }
  } else if (e.table_name === "leaves") {
    const d = e.op === "DELETE" ? o : n; const lt = LEAVE_TXT[d.leave_type] || "ลา";
    const what = `${esc(d.channel_name)} ${d.shift_label} · ${shortDate(d.work_date)}`;
    if (e.op === "INSERT") text = d.recorded_by_admin ? `บันทึก${lt}แทน <b>${esc(nameOf(d.staff_id))}</b> — ${what}` : `แจ้ง${lt} — ${what}${d.reason ? ` · "${esc(d.reason)}"` : ""}`;
    else if (ch.includes("status")) {
      text = { approved: `อนุมัติ${lt}ของ <b>${esc(nameOf(d.staff_id))}</b> — ${what}`, rejected: `ไม่อนุมัติ${lt}ของ <b>${esc(nameOf(d.staff_id))}</b> — ${what}`,
        cancelled: d.staff_id === e.actor_staff ? `ยกเลิกการแจ้ง${lt} — ${what}` : `ยกเลิกคำขอ${lt}ของ <b>${esc(nameOf(d.staff_id))}</b> — ${what}` }[n.status] || `แก้ไขการลา — ${what}`;
    } else text = `แก้ไขการลา — ${what}`;
    return { actor, text, cat: "การลา" };
  } else if (e.table_name.startsWith("pay_")) {
    const d = e.op === "DELETE" ? o : n;
    if (e.table_name === "pay_items") { const k = (typeof PAY_KINDS !== "undefined" && PAY_KINDS[d.kind]) || { t: d.kind, s: 1 };
      text = `${e.op === "DELETE" ? "ลบ" : "เพิ่ม"}รายการ${k.s > 0 ? "บวก" : "หัก"} <b>${esc(nameOf(d.staff_id))}</b> — ${esc(k.t)} ${Number(d.amount).toLocaleString("th-TH")} บาท (รอบ ${shortDate(d.period_start)})`; }

function leaveLine(s) {

  return `<div class="lv-line"><a href="#" class="lv-link" data-leave="${s.id}">ไม่สะดวกเข้ากะนี้?</a></div>`;
}

  sso: { t: "ประกันสังคม", s: -1 }, late: { t: "มาสาย", s: -1, u: "late", q: "นาที" }, sudden: { t: "ลากะทันหัน", s: -1, u: "sudden", q: "ครั้ง" },
  incomplete: { t: "ทำงานไม่ครบตามตาราง", s: -1, u: "incomplete", q: "ครั้ง" }, link: { t: "ลืมแชร์ลิงก์", s: -1, u: "link", q: "ครั้ง" },
  medcert: { t: "ไม่ส่งใบรับรองแพทย์", s: -1, u: "medcert", q: "ครั้ง" }, loan: { t: "หักเงินยืม", s: -1 }, minus_other: { t: "หักอื่นๆ", s: -1 }
};
const PAY_PLUS = Object.keys(PAY_KINDS).filter(k => PAY_KINDS[k].s > 0), PAY_MINUS = Object.keys(PAY_KINDS).filter(k => PAY_KINDS[k].s < 0);
const PAY_DEFAULT = {
  types: [{ code: "PT", name: "Part-time (3 เดือนแรก)" }, { code: "REG", name: "ประจำ (เดือนที่ 4)" }, { code: "VIP", name: "ประจำ VIP" }],
  rates: {
    PT: { L0508: 150, L0517: 650, L0817: 400, L1705: 700, L1705B: 650, S0817: 400, S2308: 400, S0817SUN: 400, S2308SUN: 450 },
    REG: { L0508: 186, L0517: 700, L0817: 500, L1705: 750, L1705B: 700, S0817: 500, S2308: 450, S0817SUN: 400, S2308SUN: 450 },
    VIP: { L0508: 186, L0517: 700, L0817: 500, L1705: 750, L1705B: 700, S0817: 500, S2308: 450, S0817SUN: 400, S2308SUN: 450 }
  },

const baht = n => (Math.round(Number(n || 0) * 100) / 100).toLocaleString("th-TH", { maximumFractionDigits: 2 });
const typeName = code => (S.pay?.cfg.types.find(t => t.code === code) || { name: code }).name;
const typeShort = code => ({ PT: "PT", REG: "ประจำ", VIP: "ประจำ VIP" }[code] || code);

function payRange() {
  const n = daysIn(S.y, S.m);
  if (!S.payRange) { const t = parseD(todayStr()); S.payRange = (t.y === S.y && t.m === S.m && t.d <= 15) ? "a" : (t.y === S.y && t.m === S.m ? "b" : "a"); }
  const [d1, d2] = S.payRange === "a" ? [1, 15] : [16, n];
  return { d1, d2, from: ymd(S.y, S.m, d1), to: ymd(S.y, S.m, d2), title: `${d1}-${d2} ${TH_MONTHS[S.m - 1]} ${S.y + 543}` };
}

async function loadPay() {
  const r = payRange(); const key = `${r.from}|${r.to}`;
  const [rows, lv, p] = await Promise.all([API.loadRange(ymd(S.y, S.m, 1), r.to), API.loadLeaves(r.from, r.to), API.loadPay(r.from)]);
  const cfgRow = (p.config || []).find(c => c.key === "rates");
  const cfg = JSON.parse(JSON.stringify(PAY_DEFAULT));
  if (cfgRow) { const v = cfgRow.value; if (v.types) cfg.types = v.types; for (const t of Object.keys(v.rates || {})) cfg.rates[t] = { ...(cfg.rates[t] || {}), ...v.rates[t] }; Object.assign(cfg.unit, v.unit || {}); Object.assign(cfg.bonus, v.bonus || {}); }
  S.pay = { key, r, cfg, rows, leaves: lv.filter(l => l.status === "approved"), staff: new Map((p.staff || []).map(x => [x.id, x])), items: p.items || [], opts: new Map((p.opts || []).map(o => [o.id, o])) };
  S.pay.calc = computePay();
}

function payCodeOf(slot) {
  const sh = shiftById(slot.shift_id); const ch = chanById(sh.channel_id); const lb = String(sh.label).replace(/\s/g, "");
  const sup = ch.code === "support"; const sun = parseD(slot.work_date).wd === 0;
  let c = null;
  if (sup || lb === "23.00-08.00") c = { "08.00-17.00": "S0817", "23.00-08.00": "S2308" }[lb] || null;
  else c = { "05.00-08.00": "L0508", "05.00-17.00": "L0517", "08.00-17.00": "L0817", "17.00-05.00": "L1705" }[lb] || null;
  if (c && c.startsWith("S") && sun) c += "SUN";
  return { code: c, sh, ch };
}

function computePay() {
  const P = S.pay; const { from, to } = P.r; const out = new Map();
  const get = id => { if (!out.has(id)) { const ps = P.staff.get(id) || {}; out.set(id, { id, st: staffById(id), ps, type: ps.rate_type || "PT", entries: [], items: [], counts: {}, base: 0, plus: 0, minus: 0, net: 0, sugg: [], monthDays: 0, pending: 0 }); } return out.get(id); };
  const monthDays = {};
  for (const s of P.rows) {
    if (!s.staff_id) continue;
    if (s.status === "approved") (monthDays[s.staff_id] ||= new Set()).add(s.work_date);
    if (s.work_date < from || s.work_date > to) continue;
    if (s.status === "pending") { get(s.staff_id).pending++; continue; }
    if (s.status !== "approved") continue;
    const p = get(s.staff_id); const { code, sh, ch } = payCodeOf(s); const o = P.opts.get(s.id); const opt = o && (!o.staff_id || o.staff_id === s.staff_id) ? o.opt : null;
    let c = code; if (c === "L1705" && opt === "break") c = "L1705B";
    p.entries.push({ date: s.work_date, slots: [s], sh, ch, code: c, raw: code, opt, nopay: opt === "nopay" });
  }
  for (const it of P.items) get(it.staff_id).items.push(it);
  for (const p of out.values()) {
    // 05-08 + 08-17 (live) on the same day = 05-17 (3 กะ)
    const byDay = {}; p.entries.forEach(e => (byDay[e.date] ||= []).push(e));
    const merged = [];
    for (const [d, list] of Object.entries(byDay)) {
      const a = list.filter(e => e.code === "L0508" && !e.nopay), b = list.filter(e => e.code === "L0817" && !e.nopay);
      while (a.length && b.length) { const x = a.shift(), y = b.shift(); x._m = y._m = true; merged.push({ date: d, slots: [...x.slots, ...y.slots], sh: x.sh, ch: x.ch, code: "L0517", merged: [x, y] }); }
    }
    p.entries = [...p.entries.filter(e => !e._m), ...merged].sort((x, y) => x.date.localeCompare(y.date) || shiftById(x.slots[0].shift_id).sort_order - shiftById(y.slots[0].shift_id).sort_order);
    const rates = P.cfg.rates[p.type] || P.cfg.rates.PT || {};
    for (const e of p.entries) {
      e.rate = e.code ? Number(rates[e.code] || 0) : 0; e.amt = e.nopay ? 0 : e.rate;
      if (!e.code) p.unknown = (p.unknown || 0) + 1;
      if (!e.nopay && e.code) p.counts[e.code] = (p.counts[e.code] || 0) + 1;
      p.base += e.amt;
    }
    for (const it of p.items) { const k = PAY_KINDS[it.kind]; if (!k) continue; if (k.s > 0) p.plus += Number(it.amount); else p.minus += Number(it.amount); }
    p.net = p.base + p.plus - p.minus;
    p.monthDays = (monthDays[p.id] || new Set()).size;
    // suggestions
    const has = k => p.items.filter(i => i.kind === k).length; const U = P.cfg.unit;
    const lvs = P.leaves.filter(l => l.staff_id === p.id);
    const sud = lvs.filter(l => l.leave_type === "sudden"); const sick = lvs.filter(l => l.leave_type === "sick");
    if (sud.length > has("sudden")) p.sugg.push({ kind: "sudden", qty: sud.length - has("sudden"), amount: (sud.length - has("sudden")) * U.sudden, why: `ลากะทันหัน ${sud.length} ครั้งในรอบนี้ (${sud.map(l => shortDate(l.work_date)).join(", ")})` });
    if (sick.length > has("medcert")) p.sugg.push({ kind: "medcert", qty: sick.length - has("medcert"), amount: (sick.length - has("medcert")) * U.medcert, why: `ลาป่วย ${sick.length} ครั้ง — เพิ่มเฉพาะถ้าไม่ส่งใบรับรองแพทย์` });
    if (S.payRange === "b" && P.cfg.bonus.amount > 0 && p.monthDays >= P.cfg.bonus.days && !has("bonus")) p.sugg.push({ kind: "bonus", qty: null, amount: P.cfg.bonus.amount, why: `ทำงาน ${p.monthDays} วันในเดือนนี้ (ครบ ${P.cfg.bonus.days} วัน)` });
    if (Number(p.ps.sso) > 0 && !has("sso")) p.sugg.push({ kind: "sso", qty: null, amount: Number(p.ps.sso), why: "ตามที่ตั้งไว้ในข้อมูลพนักงาน" });
  }
  const ord = { VIP: 0, REG: 1, PT: 2 };
  return [...out.values()].filter(p => p.st && (p.entries.length || p.items.length || p.pending))
    .sort((a, b) => (ord[a.type] ?? 3) - (ord[b.type] ?? 3) || a.st.nickname.localeCompare(b.st.nickname, "th"));
}

function payChips(p) {
  return PAY_COLS.filter(([k]) => p.counts[k]).map(([k]) => `<span class="pchip">${PAY_COL[k].s} <b>×${p.counts[k]}</b></span>`).join("");
}

async function payAction(fn, okMsg, reopen) {
  try { await fn(); await loadPay(); if (okMsg) toast(okMsg, "ok"); if (S.tab === "pay") render(); if (reopen) reopen(); }

}

    payAction(() => API.rpc("admin_pay_add_item", { p_staff_id: id, p_period_start: pStart, p_kind: kSel.value, p_amount: amt, p_qty: k.u ? Number(qI.value) || null : null, p_note: $("#aiN").value }), "เพิ่มรายการแล้ว", reopen); };
  document.querySelectorAll("[data-sg]").forEach(b => b.onclick = () => { const g = p.sugg[+b.dataset.sg]; b.disabled = true;
    payAction(() => API.rpc("admin_pay_add_item", { p_staff_id: id, p_period_start: pStart, p_kind: g.kind, p_amount: g.amount, p_qty: g.qty, p_note: g.why }), "เพิ่มรายการแล้ว", reopen); });
  document.querySelectorAll("[data-di]").forEach(b => b.onclick = () => { b.disabled = true; payAction(() => API.rpc("admin_pay_delete_item", { p_id: +b.dataset.di }), "ลบรายการแล้ว", reopen); });
  document.querySelectorAll("[data-brk]").forEach(b => b.onchange = () => payAction(() => API.rpc("admin_pay_set_slot_opt", { p_slot_id: +b.dataset.brk, p_opt: b.checked ? "break" : null }), null, reopen));
  document.querySelectorAll("[data-nop]").forEach(b => b.onchange = () => payAction(() => API.rpc("admin_pay_set_slot_opt", { p_slot_id: +b.dataset.nop, p_opt: b.checked ? "nopay" : null }), null, reopen));
  $("#ppType").onchange = () => { const ps = p.ps; payAction(() => API.rpc("admin_pay_save_staff", { p_id: id, p_rate_type: $("#ppType").value, p_full_name: ps.full_name || null, p_bank: ps.bank || null, p_account_no: ps.account_no || null, p_phone: ps.phone || null, p_start_date: ps.start_date || null, p_sso: Number(ps.sso) || 0, p_note: ps.note || null }), "เปลี่ยนเรตแล้ว", reopen); };
  $("#ppInfo").onclick = () => openPayInfo(id, reopen);
}

function openPayInfo(id, back) {
  const st = staffById(id); const ps = S.pay.staff.get(id) || { rate_type: "PT" };
  const inp = (k, lbl, v, type = "text", ph = "") => `<label class="field">${lbl}<input type="${type}" id="pi_${k}" value="${esc(v ?? "")}" placeholder="${esc(ph)}" ${type === "date" ? 'style="border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 10px"' : ""}></label>`;
  openSheet(`<h3>ข้อมูลบัญชี · ${esc(st.nickname)}</h3><p class="lead">ใช้ในไฟล์ Excel ใบเงินเดือน · เห็นเฉพาะแอดมิน</p>
    ${inp("fn", "ชื่อ-นามสกุล", ps.full_name)}
    <div style="display:flex;gap:10px">${inp("bk", "ธนาคาร", ps.bank, "text", "กสิกรไทย")}${inp("ac", "เลขบัญชี", ps.account_no, "text", "xxx-x-xxxxx-x")}</div>
    <div style="display:flex;gap:10px">${inp("ph", "เบอร์โทร", ps.phone)}${inp("sd", "วันเริ่มงาน", ps.start_date, "date")}</div>
    ${inp("sso", "หักประกันสังคม ต่อรอบ (บาท) — ใส่ 0 ถ้าไม่หัก", ps.sso || 0, "number")}
    ${inp("nt", "หมายเหตุ", ps.note)}
    <div class="btns"><button class="btn" id="piBack">กลับ</button><button class="btn pri" id="piSv">บันทึก</button></div>`);
  $("#piBack").onclick = back;
  $("#piSv").onclick = () => payAction(() => API.rpc("admin_pay_save_staff", { p_id: id, p_rate_type: ps.rate_type || "PT", p_full_name: $("#pi_fn").value, p_bank: $("#pi_bk").value, p_account_no: $("#pi_ac").value, p_phone: $("#pi_ph").value, p_start_date: $("#pi_sd").value || null, p_sso: Number($("#pi_sso").value) || 0, p_note: $("#pi_nt").value }), "บันทึกแล้ว", back);
}

function openPayRates() {
  const C = S.pay.cfg; const T = C.types;
  openSheet(`<h3>ตั้งค่าเรตค่าจ้าง</h3><p class="lead">บาทต่อกะ · มีผลกับการคำนวณทุกรอบ (รวมรอบเก่าที่เปิดดูใหม่)</p>
    <div class="rtab"><table><thead><tr><th>กะ</th>${T.map(t => `<th>${esc(typeShort(t.code))}</th>`).join("")}</tr></thead><tbody>
    ${PAY_COLS.map(([k, t]) => `<tr><td>${t}</td>${T.map(ty => `<td><input type="number" min="0" data-rt="${esc(ty.code)}" data-rk="${k}" value="${Number(C.rates[ty.code]?.[k] ?? 0)}"></td>`).join("")}</tr>`).join("")}
    </tbody></table></div>
    <h4 class="rt-h">ค่าปรับ / ค่าต่อหน่วย</h4>
    <div class="rgrid">${[["late", "มาสาย (ต่อนาที)"], ["link", "ลืมแชร์ลิงก์ (ต่อครั้ง)"], ["sudden", "ลากะทันหัน (ต่อครั้ง)"], ["medcert", "ไม่ส่งใบรับรองแพทย์"], ["incomplete", "ทำงานไม่ครบตามตาราง"], ["tiktok", "TikTok Live (ต่อ ชม.)"]].map(([k, t]) => `<label class="field">${t}<input type="number" min="0" data-un="${k}" value="${Number(C.unit[k] || 0)}"></label>`).join("")}</div>
    <h4 class="rt-h">เบี้ยขยัน (แนะนำในรอบ 16–สิ้นเดือน)</h4>
    <div class="rgrid"><label class="field">ทำงานครบ (วัน/เดือน)<input type="number" min="1" id="bnD" value="${Number(C.bonus.days)}"></label><label class="field">ได้เบี้ยขยัน (บาท)<input type="number" min="0" id="bnA" value="${Number(C.bonus.amount)}"></label></div>
    <div class="btns"><button class="btn" data-close>ยกเลิก</button><button class="btn pri" id="rtSv">บันทึกเรต</button></div>`, "wide");
  $("#rtSv").onclick = () => {
    const v = JSON.parse(JSON.stringify(C));
    document.querySelectorAll("[data-rt]").forEach(i => { (v.rates[i.dataset.rt] ||= {})[i.dataset.rk] = Number(i.value) || 0; });
    document.querySelectorAll("[data-un]").forEach(i => { v.unit[i.dataset.un] = Number(i.value) || 0; });
    v.bonus = { days: Number($("#bnD").value) || 26, amount: Number($("#bnA").value) || 0 };
    payAction(() => API.rpc("admin_pay_set_config", { p_key: "rates", p_value: v }), "บันทึกเรตแล้ว", closeSheet);
  };
}

async function exportPaySlip() {
  const btn = $("#payX"); btn.disabled = true; btn.textContent = "กำลังสร้างไฟล์…";
  try {
    await loadXLSX(); const P = S.pay; const L = P.calc; const r = P.r;
    if (!L.length) throw new Error("ยังไม่มีข้อมูลในรอบนี้");
    const E = XLSX.utils.encode_cell;
    const head = ["ลำดับ", "เรตจ้าง", "ชื่อเล่น", "ชื่อ-นามสกุล", "ธนาคาร", "เลขบัญชี"];
    PAY_COLS.forEach(([k, t]) => head.push(`${t} (จำนวน)`, `${t} (เรต)`));
    const baseCol = head.length; head.push("ยอดรวมค่ากะ");
    const plusStart = head.length; PAY_PLUS.forEach(k => head.push(PAY_KINDS[k].t));
    const minusStart = head.length; PAY_MINUS.forEach(k => head.push(PAY_KINDS[k].t));
    const netCol = head.length; head.push("สรุปจ่ายค่าจ้าง", "หมายเหตุ");
    const ws = {}; const set = (R, Cc, cell) => { ws[E({ r: R, c: Cc })] = cell; };
    set(0, 0, { t: "s", v: `เงินเดือนพนักงาน ไลฟ์ ประจำวันที่ ${r.title}` });
    head.forEach((h, i) => set(1, i, { t: "s", v: h }));
    L.forEach((p, i) => {
      const R = i + 2; const rates = P.cfg.rates[p.type] || {};
      [i + 1, typeShort(p.type), p.st.nickname, p.ps.full_name || "", p.ps.bank || "", p.ps.account_no || ""].forEach((v, c) => set(R, c, typeof v === "number" ? { t: "n", v } : { t: "s", v: String(v) }));
      const parts = [];
      PAY_COLS.forEach(([k], j) => { const c = 6 + j * 2; const n = p.counts[k] || 0; if (n) { set(R, c, { t: "n", v: n }); set(R, c + 1, { t: "n", v: Number(rates[k] || 0) }); } parts.push(`${E({ r: R, c })}*${E({ r: R, c: c + 1 })}`); });
      set(R, baseCol, { t: "n", v: p.base, f: parts.join("+") });
      const sumK = k => p.items.filter(it => it.kind === k).reduce((a, it) => a + Number(it.amount), 0);
      PAY_PLUS.forEach((k, j) => { const v = sumK(k); if (v) set(R, plusStart + j, { t: "n", v }); });
      PAY_MINUS.forEach((k, j) => { const v = sumK(k); if (v) set(R, minusStart + j, { t: "n", v }); });
      const rng = (a, b) => `SUM(${E({ r: R, c: a })}:${E({ r: R, c: b })})`;
      set(R, netCol, { t: "n", v: p.net, f: `${E({ r: R, c: baseCol })}+${rng(plusStart, minusStart - 1)}-${rng(minusStart, netCol - 1)}` });
      const notes = [...p.items.filter(it => it.note).map(it => `${PAY_KINDS[it.kind]?.t}: ${it.note}`), ...p.entries.filter(e => e.nopay).map(e => `ไม่จ่าย ${shortDate(e.date)} ${e.sh.label}`)];
      if (notes.length) set(R, netCol + 1, { t: "s", v: notes.join(" / ") });
    });
    const TR = L.length + 2; set(TR, 2, { t: "s", v: "รวม" });
    for (const c of [baseCol, ...PAY_PLUS.map((_, j) => plusStart + j), ...PAY_MINUS.map((_, j) => minusStart + j), netCol]) {
      const v = L.reduce((a, p, i) => a + Number((ws[E({ r: i + 2, c })] || {}).v || 0), 0); set(TR, c, { t: "n", v, f: `SUM(${E({ r: 2, c })}:${E({ r: TR - 1, c })})` });
    }
    ws["!ref"] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: TR, c: netCol + 1 } });
    ws["!cols"] = head.map((h, i) => ({ wch: i < 6 ? [6, 10, 12, 28, 12, 16][i] : i === netCol + 1 ? 40 : 11 }));
    ws["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 10 } }];
    const det = []; L.forEach(p => p.entries.forEach(e => det.push({ "วันที่": e.date, "วัน": WD[parseD(e.date).wd], "ชื่อเล่น": p.st.nickname, "เรตจ้าง": typeShort(p.type),
      "ช่อง / กะ": e.merged ? e.merged.map(m => `${m.ch.name} ${m.sh.label}`).join(" + ") : `${e.ch.name} ${e.sh.label}`, "คิดเป็น": e.code ? PAY_COL[e.code].t : "ไม่รู้จักเรต", "บาท": e.amt, "หมายเหตุ": [e.merged ? "รวม 05-08 + 08-17" : "", e.opt === "break" ? "พัก 1 ชม." : "", e.nopay ? "ไม่จ่าย" : ""].filter(Boolean).join(", ") })));
    const its = []; L.forEach(p => p.items.forEach(it => its.push({ "ชื่อเล่น": p.st.nickname, "ประเภท": PAY_KINDS[it.kind]?.s > 0 ? "บวก" : "หัก", "รายการ": PAY_KINDS[it.kind]?.t || it.kind, "จำนวน": it.qty || "", "บาท": Number(it.amount), "หมายเหตุ": it.note || "" })));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "ใบเงินเดือน");
    const w2 = XLSX.utils.json_to_sheet(det.length ? det : [{ "วันที่": "ไม่มีกะ" }]); w2["!cols"] = [12, 9, 12, 10, 34, 30, 8, 22].map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, w2, "รายละเอียดกะ");
    const w3 = XLSX.utils.json_to_sheet(its.length ? its : [{ "ชื่อเล่น": "ไม่มีรายการบวก/หัก" }]); w3["!cols"] = [12, 8, 26, 8, 10, 40].map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, w3, "รายการบวก-หัก");
    XLSX.writeFile(wb, `เงินเดือนไลฟ์_${r.from}_ถึง_${r.to}.xlsx`);
    toast(`ดาวน์โหลดแล้ว ${L.length} คน · รวม ฿${baht(L.reduce((a, p) => a + p.net, 0))}`, "ok");
  } catch (e) { toast(e.message, "err"); }
  finally { btn.disabled = false; btn.textContent = "⬇ Excel ใบเงินเดือน"; }
}

/* ===== Sheet (modal) ===== */
function openSheet(html, cls) {
  const prevScroll = $("#scrim .sheet")?.scrollTop || 0; const same = cls && $("#scrim .sheet")?.dataset.cls === cls;
  closeSheet();
  const d = document.createElement("div"); d.className = "scrim"; d.id = "scrim";
  d.innerHTML = `<div class="sheet ${cls || ""}" data-cls="${cls || ""}" role="dialog" aria-modal="true">${html}</div>`;
  d.addEventListener("click", e => { if (e.target === d || e.target.closest("[data-close]")) closeSheet(); });
  document.body.appendChild(d);
  if (same && prevScroll) d.firstChild.scrollTop = prevScroll; else if (same) d.style.animation = "none";
}
function closeSheet() { const d = $("#scrim"); if (d) d.remove(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

boot();
</script>
